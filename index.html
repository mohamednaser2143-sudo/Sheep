<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Your Name 🐑</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Fredoka', 'Outfit', sans-serif;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
        }

        @keyframes floatCloud {
            0% { transform: translateX(-150px); }
            100% { transform: translateX(calc(100vw + 150px)); }
        }

        @keyframes floatSheep {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }

        .animate-float-sheep { animation: floatSheep 3s ease-in-out infinite; }

        .cloud {
            position: absolute;
            color: rgba(255, 255, 255, 0.85);
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.03));
            pointer-events: none;
        }

        .hill-1 {
            background: linear-gradient(180deg, #86efac 0%, #4ade80 100%);
            border-top-left-radius: 50% 100%;
            border-top-right-radius: 50% 100%;
        }
        .hill-2 {
            background: linear-gradient(180deg, #4ade80 0%, #22c55e 100%);
            border-top-left-radius: 60% 100%;
            border-top-right-radius: 40% 100%;
        }
    </style>
</head>
<body class="min-h-screen w-screen relative bg-gradient-to-b from-sky-200 via-sky-100 to-emerald-100 flex flex-col justify-between items-center overflow-x-hidden">

    <!-- Floating Background Clouds -->
    <div id="clouds-container" class="absolute inset-0 pointer-events-none z-0"></div>

    <!-- Header -->
    <header class="w-full pt-6 px-6 flex justify-center items-center z-10 max-w-4xl mx-auto">
        <div class="flex items-center gap-2 bg-white/80 backdrop-blur-md px-4 py-2 rounded-full shadow-sm border border-white">
            <span class="text-2xl">🐑</span>
            <span class="font-bold text-emerald-800 tracking-wide text-sm sm:text-base">Sheep Sign-In</span>
            <span class="text-2xl">🐑</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="z-10 my-auto py-8 px-4 w-full max-w-md text-center">
        <div class="glass-card rounded-3xl p-6 sm:p-8">
            <!-- Hero Sheep -->
            <div class="relative w-24 h-24 sm:w-28 sm:h-28 mx-auto mb-4 flex items-center justify-center">
                <div class="absolute inset-0 bg-emerald-300/40 rounded-full blur-xl"></div>
                <div class="text-6xl sm:text-7xl select-none animate-float-sheep">🐑</div>
            </div>

            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800 mb-2 tracking-tight">
                🐑 Enter Your Name 🐑
            </h1>
            <p class="text-slate-600 text-sm sm:text-base mb-6 font-medium leading-relaxed">
                Type your name and tap submit. 🌿
            </p>

            <!-- Name entry form -->
            <form id="name-form" class="space-y-3" onsubmit="submitName(event)">
                <input
                    id="name-input"
                    type="text"
                    autocomplete="off"
                    placeholder="Your name"
                    class="w-full py-4 px-5 text-center text-lg font-semibold text-slate-800 bg-white border-2 border-emerald-200 rounded-2xl shadow-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition"
                />
                <button
                    id="submit-btn"
                    type="submit"
                    class="w-full py-4 px-6 bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 active:scale-95 text-white font-extrabold text-lg rounded-2xl shadow-lg transition-all flex items-center justify-center gap-2 disabled:opacity-60"
                >
                    <span class="text-xl">🐑</span>
                    <span id="submit-label">Submit</span>
                </button>
            </form>

            <div id="name-toast" class="hidden mt-3 text-sm font-bold text-emerald-800 bg-emerald-100 p-3 rounded-xl">
                <i class="fa-solid fa-check-circle"></i> <span id="name-toast-text">Thanks! Your name was added.</span>
            </div>
            <div id="name-error" class="hidden mt-3 text-sm font-bold text-red-700 bg-red-100 p-3 rounded-xl">
                <i class="fa-solid fa-circle-xmark"></i> <span id="name-error-text">Something went wrong. Please try again.</span>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full relative h-28 sm:h-36 z-0 pointer-events-none">
        <div class="hill-1 absolute -bottom-10 -left-10 w-[120%] h-36 opacity-90"></div>
        <div class="hill-2 absolute -bottom-12 -right-10 w-[120%] h-36 flex items-start justify-center pt-3">
            <p class="text-white/90 text-xs font-semibold tracking-wide pointer-events-auto mt-2">
                Created with 💚 for the Sheep Community
            </p>
        </div>
    </footer>

    <script>
        // ====================================================================
        // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BELOW (the .../exec link).
        // Until you do, submitting shows a reminder instead of saving.
        // ====================================================================
        const SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycbzg3ll47hVh_v6LJF2snpe99OAPFDvGjEYBQbxHiaFJ8pGEUl3HqSKSYeBhDbZnXKoA/exec";

        function submitName(event) {
            event.preventDefault();
            const input = document.getElementById('name-input');
            const name = input.value.trim();
            if (!name) return;

            if (!SHEET_ENDPOINT) {
                showError("The spreadsheet link isn't set up yet.");
                return;
            }

            const btn = document.getElementById('submit-btn');
            const label = document.getElementById('submit-label');
            btn.disabled = true;
            label.innerText = "Saving...";

            // Google Apps Script doesn't send CORS headers, so we POST as
            // plain text with no-cors. The write still happens; we just can't
            // read the response, so a completed request is treated as success.
            fetch(SHEET_ENDPOINT, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ name: name })
            })
            .then(function () {
                input.value = "";
                showSuccess("Thanks, " + name + "! You're on the list. 🐑");
            })
            .catch(function () {
                showError("Couldn't save. Check your connection and try again.");
            })
            .finally(function () {
                btn.disabled = false;
                label.innerText = "Submit";
            });
        }

        function showSuccess(msg) {
            const toast = document.getElementById('name-toast');
            document.getElementById('name-error').classList.add('hidden');
            document.getElementById('name-toast-text').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3500);
        }

        function showError(msg) {
            const err = document.getElementById('name-error');
            document.getElementById('name-toast').classList.add('hidden');
            document.getElementById('name-error-text').innerText = msg;
            err.classList.remove('hidden');
            setTimeout(() => err.classList.add('hidden'), 4000);
        }

        function initClouds() {
            const container = document.getElementById('clouds-container');
            for (let i = 0; i < 6; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                const topPos = Math.random() * 45;
                const duration = 25 + Math.random() * 30;
                const delay = Math.random() * -30;
                const scale = 0.6 + Math.random() * 0.8;
                cloud.style.top = `${topPos}%`;
                cloud.style.left = `0px`;
                cloud.style.fontSize = `${scale * 3.5}rem`;
                cloud.style.animation = `floatCloud ${duration}s linear infinite`;
                cloud.style.animationDelay = `${delay}s`;
                cloud.innerHTML = '<i class="fa-solid fa-cloud"></i>';
                container.appendChild(cloud);
            }
        }

        window.onload = function () {
            initClouds();
        };
    </script>
</body>
</html>
